name: Release

on:
  # Disabled in this personal fork: releases are published from
  # Start9-Community/snowflake-startos-sideloader, which holds the
  # registry/S3 credentials. Manual dispatch only, to avoid failed
  # runs and duplicate/confusing builds.
  workflow_dispatch:

jobs:
  release:
    uses: Start9Labs/start-technologies/.github/workflows/release.yml@master
    with:
      RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ vars.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    permissions:
      contents: write
